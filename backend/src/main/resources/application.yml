spring:
  application:
    name: coltrip-backend
  config:
    import: optional:application-secret.yml
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug

ai:
  base-url: ${AI_BASE_URL:}
  api-key: ${AI_API_KEY:}
  data-source: ${AI_DATA_SOURCE:real}
  connect-timeout-millis: 3000
  read-timeout-millis: 30000

visit:
  nudge:
    max-score-age: PT5H
    proposal-ttl: PT10M
    # 진행 중 방문 백그라운드 평가 주기(ms). 잠정값 - 이슈 #89
    background-interval-ms: 120000

fcm:
  # 서비스 계정 JSON 파일 경로. 비어있으면 백그라운드 푸시 발송이 자동으로 비활성화된다(로그만 남김).
  credentials-path: ${FCM_CREDENTIALS_PATH:}

forecast:
  source: coltrip-ai

quiet-index:
  map-sync:
    # 매시 5분에 실행 (AI GET /quiet-index/map 풀링, 이슈 #63)
    cron: "0 5 * * * *"
