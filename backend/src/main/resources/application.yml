spring:
  application:
    name: coltrip-backend
  config:
    import: optional:application-secret.yml
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug

ai:
  base-url: ${AI_BASE_URL:}
  api-key: ${AI_API_KEY:}
  data-source: ${AI_DATA_SOURCE:real}
  connect-timeout-millis: 3000
  read-timeout-millis: 30000

visit:
  nudge:
    max-score-age: PT5H
    proposal-ttl: PT10M
