# 이 파일을 application-secret.yml로 복사해서 실제 값을 채워넣으세요.
# application-secret.yml은 .gitignore에 등록되어 있어 커밋되지 않습니다.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/coltrip
    username: root
    password: your-local-db-password
    driver-class-name: com.mysql.cj.jdbc.Driver

jwt:
  secret: change-this-to-a-random-string-at-least-32-characters-long
  access-token-expire-seconds: 3600
  refresh-token-expire-seconds: 1209600

oauth:
  google:
    client-id: your-google-oauth-web-client-id
    client-secret: your-google-oauth-web-client-secret

naver:
  client-id: your-naver-cloud-client-id
  client-secret: your-naver-cloud-client-secret
