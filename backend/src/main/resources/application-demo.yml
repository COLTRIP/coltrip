spring:
  datasource:
    url: ${demo.datasource-url}
    username: ${demo.datasource-username}
    password: ${demo.datasource-password}
  jpa:
    hibernate:
      ddl-auto: validate

app:
  environment: ${APP_ENVIRONMENT:}

demo:
  enabled: true
  allowed-google-subs: ${DEMO_ALLOWED_GOOGLE_SUBS:}

jwt:
  secret: ${demo.jwt-secret}
  # 베이스 application.yml/application-secret.yml에 기본값이 없어 미설정 시 0(즉시 만료)으로 바인딩된다.
  access-token-expire-seconds: 3600
  refresh-token-expire-seconds: 1209600

fcm:
  credentials-path: ""

quiet-index:
  map-sync:
    cron: "-"
